name: CI/CD Security & Testing Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-and-prompt-tests:
    name: Security & Prompt Injection Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Prompt Engineering & Injection Red-Teaming Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_prompt_engineering.py -v

      - name: Run Security Hardening & Vulnerability Audit Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_security_hardening.py -v

      - name: Run Full Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest -v

  build-and-push:
    name: Build and Push Docker Image
    needs: security-and-prompt-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/panda-agent:latest,${{ secrets.DOCKERHUB_USERNAME }}/panda-agent:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/panda-agent:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/panda-agent:buildcache,mode=max
