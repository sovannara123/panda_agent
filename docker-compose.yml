services:
  panda-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panda-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_PROVIDER=ollama
      - MODEL_NAME=llama3:latest
      - AGENT_NAME=NARA
      - AGENT_ROLE=AI learning assistant
      - AGENT_VERSION=1.0
      - MESSAGE_LIMIT_FREE=10
      - MAX_HISTORY=20
      - RETRY_ATTEMPTS=3
      - RETRY_DELAY=0.2
      - USER_PLAN=premium
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/agent.log
    volumes:
      - panda-data:/app/data
      - panda-logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - panda-network

  ollama:
    image: ollama/ollama:latest
    container_name: panda-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - panda-network
    # Uncomment for GPU support (requires NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Optional: Nginx reverse proxy (uncomment to enable)
  # nginx:
  #   image: nginx:alpine
  #   container_name: panda-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - panda-api
  #   restart: unless-stopped
  #   networks:
  #     - panda-network

volumes:
  panda-data:
    driver: local
  panda-logs:
    driver: local
  ollama-models:
    driver: local

networks:
  panda-network:
    driver: bridge